<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Fugah Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var storeId = params.get("storeId");
  if (!storeId) {
    console.warn("[Fugah] widget-frame: No storeId in URL.");
    return;
  }

  window.fuqahActivate = function () {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "fuqah:active" }, "*");
    }
  };
  window.fuqahDeactivate = function () {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "fuqah:inactive" }, "*");
    }
  };

  var script = document.createElement("script");
  script.src = "widget.js";
  script.setAttribute("data-store-id", storeId);
  script.charset = "UTF-8";
  document.body.appendChild(script);
})();
  </script>
</body>
</html>
